<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>りっくん♡通知</title>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:system-ui, sans-serif;
}

body{
    background-image:url("bg.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* ⭐ タブ（大きくした） */
.window{
    width:420px;   /* ←拡大 */
    background:#ffffff;
    border:1px solid #ff9fc6;
    border-radius:16px;
    box-shadow:0 12px 30px rgba(255, 150, 190, 0.3);

    position:absolute;
}

/* 上バー */
.topbar{
    height:52px;   /* ←拡大 */
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;

    background:linear-gradient(90deg, #ffe4f0, #fff);
    border-bottom:1px solid #ffd0e5;

    cursor:move;
    user-select:none;
}

/* タイトル */
.title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:15px;  /* ←少し大きく */
    color:#ff5fa2;
    font-weight:700;
}

/* ◯♡ */
.mark{
    position:relative;
    width:16px;
    height:16px;
}
.mark::before{
    content:"";
    position:absolute;
    width:16px;
    height:16px;
    border:2px solid #ff5fa2;
    border-radius:50%;
}
.mark::after{
    content:"♡";
    position:absolute;
    left:2px;
    top:-2px;
    font-size:11px;
    color:#ff5fa2;
}

/* × */
.close{
    color:#ff7fb0;
    cursor:pointer;
    padding:6px 10px;
    border-radius:8px;
    font-size:16px;
}
.close:hover{
    background:#ffe1ee;
}

/* 本文 */
.content{
    padding:16px;
    color:#555;
    font-size:14px;
}

/* 出現 */
@keyframes pop{
    from{ transform:scale(0.85); opacity:0; }
    to{ transform:scale(1); opacity:1; }
}
</style>
</head>

<body>

<script>

/* ランダム位置（サイズ対応） */
function randomPos(win){
    const rect = win.getBoundingClientRect();

    const maxX = window.innerWidth - rect.width;
    const maxY = window.innerHeight - rect.height;

    return {
        x: Math.random() * Math.max(0, maxX),
        y: Math.random() * Math.max(0, maxY)
    };
}

/* ⭐ ここが重要：全タブに確実にドラッグ付与 */
function enableDrag(win){
    const bar = win.querySelector(".topbar");

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    bar.onmousedown = (e)=>{
        dragging = true;
        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;
    };

    document.addEventListener("mousemove", (e)=>{
        if(!dragging) return;
        win.style.left = (e.clientX - offsetX) + "px";
        win.style.top  = (e.clientY - offsetY) + "px";
    });

    document.addEventListener("mouseup", ()=>{
        dragging = false;
    });
}

function createWindow(){

    const win = document.createElement("div");
    win.className = "window";

    win.innerHTML = `
        <div class="topbar">
            <div class="title">
                <div class="mark"></div>
                りっくん♡通知
            </div>
            <div class="close">✕</div>
        </div>

        <div class="content">
            りっくん♡を検知しました
        </div>
    `;

    document.body.appendChild(win);

    /* サイズ確定後に位置決定 */
    const pos = randomPos(win);
    win.style.left = pos.x + "px";
    win.style.top = pos.y + "px";

    enableDrag(win);

    win.querySelector(".close").onclick = () => {
        createWindow();
    };
}

/* 初期 */
createWindow();

</script>

</body>
</html>
