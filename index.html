<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>りっくん♡通知</title>

<style>

/* ⭐ 超重要：これでズレ系全部潰す */
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* 背景 */
body{
    font-family:system-ui, sans-serif;

    background-image:url("bg.jpg"); /* ←ここだけ変更 */
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;

    background-color:#fff; /* 画像読み込み失敗時用 */
}

/* ウィンドウ */
.window{
    width:340px;
    background:#ffffff;
    border:1px solid #ff9fc6;
    border-radius:14px;
    box-shadow:0 10px 25px rgba(255, 150, 190, 0.25);

    position:absolute;
    overflow:hidden;
    animation:pop 0.15s ease;
}

/* 上バー */
.topbar{
    height:40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;

    background:linear-gradient(90deg, #ffe4f0, #fff);
    border-bottom:1px solid #ffd0e5;

    cursor:move;
    user-select:none;
}

/* タイトル */
.title{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:#ff5fa2;
    font-weight:600;
}

/* ◯♡ */
.mark{
    position:relative;
    width:14px;
    height:14px;
}
.mark::before{
    content:"";
    position:absolute;
    width:14px;
    height:14px;
    border:2px solid #ff5fa2;
    border-radius:50%;
}
.mark::after{
    content:"♡";
    position:absolute;
    left:1px;
    top:-2px;
    font-size:10px;
    color:#ff5fa2;
}

/* × */
.close{
    color:#ff7fb0;
    cursor:pointer;
    padding:4px 8px;
    border-radius:8px;
}
.close:hover{
    background:#ffe1ee;
}

/* 本文 */
.content{
    padding:14px;
    color:#555;
    font-size:13px;
}

/* アニメ */
@keyframes pop{
    from{ transform:scale(0.85); opacity:0; }
    to{ transform:scale(1); opacity:1; }
}

</style>
</head>

<body>

<script>

function randomPos(){
    return {
        x: Math.random() * (window.innerWidth - 360),
        y: Math.random() * (window.innerHeight - 220)
    };
}

/* ドラッグ */
function enableDrag(win){
    const bar = win.querySelector(".topbar");

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    bar.onmousedown = (e)=>{
        dragging = true;
        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;
    };

    document.onmousemove = (e)=>{
        if(!dragging) return;
        win.style.left = (e.clientX - offsetX) + "px";
        win.style.top  = (e.clientY - offsetY) + "px";
    };

    document.onmouseup = ()=>{
        dragging = false;
    };
}

/* ウィンドウ生成 */
function createWindow(){

    const pos = randomPos();

    const win = document.createElement("div");
    win.className = "window";

    win.style.left = pos.x + "px";
    win.style.top = pos.y + "px";

    win.innerHTML = `
        <div class="topbar">
            <div class="title">
                <div class="mark"></div>
                りっくん♡通知
            </div>
            <div class="close">✕</div>
        </div>

        <div class="content">
            りっくん♡を検知しました
        </div>
    `;

    document.body.appendChild(win);

    enableDrag(win);

    win.querySelector(".close").onclick = () => {
        createWindow();
    };
}

/* 初期起動 */
createWindow();

</script>

</body>
</html>
